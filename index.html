<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SousChefBook — Тома 1–2. Школа су-шефа и шефа ресторана</title>

<style>
  :root {
    --bg: #0a0908;
    --bg-card: rgba(28,26,24,0.72);
    --accent: #c9b896;
    --accent-dim: rgba(201,184,150,0.12);
    --accent-glow: rgba(201,184,150,0.18);
    --text: #e8e4df;
    --text-dim: #9a9590;
    --border: rgba(201,184,150,0.15);
    --success: #7fb069;
    --danger: #c75146;
    --warning: #e9c46a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.6;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }
  .app { position: relative; z-index: 1; }
  .header {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(10,9,8,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-title {
    font-family: 'Georgia', 'Times New Roman', 'Noto Serif', serif;
    font-size: 1.15rem;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .header-sub { font-size: 0.7rem; color: var(--text-dim); font-weight: 300; }
  .menu-btn, .search-btn {
    width: 40px; height: 40px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 1.2rem;
    backdrop-filter: blur(12px);
  }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 300px;
    background: rgba(14,13,12,0.97);
    backdrop-filter: blur(30px);
    border-right: 1px solid var(--border);
    z-index: 200;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    overflow-y: auto;
    padding: 20px 0;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 199; opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .sidebar-overlay.open { opacity: 1; pointer-events: all; }
  .sidebar-header {
    padding: 0 20px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .sidebar-title {
    font-family: 'Georgia', 'Times New Roman', 'Noto Serif', serif;
    font-size: 1.3rem;
    color: var(--accent);
  }
  .progress-bar {
    height: 4px; background: rgba(201,184,150,0.1);
    border-radius: 2px; margin-top: 10px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    border-radius: 2px; transition: width 0.5s ease;
  }
  .progress-text { font-size: 0.7rem; color: var(--text-dim); margin-top: 6px; }
  .nav-item {
    padding: 14px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 12px;
  }
  .nav-item:hover { background: rgba(201,184,150,0.05); }
  .nav-item.active { border-left-color: var(--accent); background: rgba(201,184,150,0.08); }
  .nav-num {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 600; color: var(--accent);
    flex-shrink: 0;
  }
  .nav-item.active .nav-num { background: var(--accent); color: var(--bg); }
  .nav-text { font-size: 0.85rem; font-weight: 500; }
  .nav-check {
    margin-left: auto; width: 18px; height: 18px;
    border-radius: 50%; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; color: transparent;
  }
  .nav-check.done { border-color: var(--success); color: var(--success); }
  .main { padding: 76px 16px 100px; max-width: 800px; margin: 0 auto; }
  .module-header { margin-bottom: 24px; }
  .module-num {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;
    color: var(--accent); margin-bottom: 6px;
  }
  .module-title {
    font-family: 'Georgia', 'Times New Roman', 'Noto Serif', serif;
    font-size: 1.6rem; font-weight: 600;
    line-height: 1.3;
  }
  .module-time {
    font-size: 0.75rem; color: var(--text-dim); margin-top: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    transition: box-shadow 0.3s;
  }
  .card:hover { box-shadow: 0 4px 24px rgba(201,184,150,0.06); }
  .card-title {
    font-family: 'Georgia', 'Times New Roman', 'Noto Serif', serif;
    font-size: 1.15rem; color: var(--accent);
    margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
  }
  .card-icon { font-size: 1.3rem; }
  .card p { font-size: 0.9rem; color: var(--text); margin-bottom: 10px; }
  .card ul { margin-left: 18px; margin-bottom: 12px; }
  .card li { font-size: 0.88rem; color: var(--text); margin-bottom: 6px; }
  .card strong { color: var(--accent); font-weight: 600; }
  .highlight {
    background: rgba(201,184,150,0.06);
    border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding: 14px 16px;
    margin: 14px 0;
    font-size: 0.88rem;
  }
  .highlight-danger {
    background: rgba(199,81,70,0.08);
    border-left-color: var(--danger);
  }
  .highlight-success {
    background: rgba(127,176,105,0.08);
    border-left-color: var(--success);
  }
  .formula {
    background: rgba(10,9,8,0.6);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--accent);
    text-align: center;
    margin: 12px 0;
    letter-spacing: 0.5px;
  }
  .checklist-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(201,184,150,0.06);
    cursor: pointer;
  }
  .checklist-item:last-child { border-bottom: none; }
  .check-box {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 6px;
    flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .check-box.checked {
    background: var(--success); border-color: var(--success);
    color: white; font-size: 0.75rem;
  }
  .check-text { font-size: 0.88rem; color: var(--text); }
  .check-text.done { text-decoration: line-through; color: var(--text-dim); }
  .quiz-container { margin-top: 8px; }
  .quiz-question {
    font-weight: 600; font-size: 0.95rem;
    margin-bottom: 14px; color: var(--text);
  }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .quiz-option {
    background: rgba(10,9,8,0.5);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    font-size: 0.88rem;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 12px;
  }
  .quiz-option:hover { border-color: var(--accent); background: rgba(201,184,150,0.05); }
  .quiz-option.selected { border-color: var(--accent); background: rgba(201,184,150,0.1); }
  .quiz-option.correct { border-color: var(--success); background: rgba(127,176,105,0.1); }
  .quiz-option.wrong { border-color: var(--danger); background: rgba(199,81,70,0.1); }
  .opt-letter {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 600;
    flex-shrink: 0;
  }
  .quiz-option.selected .opt-letter { border-color: var(--accent); color: var(--accent); }
  .quiz-option.correct .opt-letter { border-color: var(--success); color: var(--success); }
  .quiz-option.wrong .opt-letter { border-color: var(--danger); color: var(--danger); }
  .quiz-explanation {
    margin-top: 12px; padding: 14px;
    background: rgba(201,184,150,0.05);
    border-radius: 10px;
    font-size: 0.85rem; color: var(--text-dim);
    display: none;
  }
  .quiz-explanation.show { display: block; }
  .quiz-nav {
    display: flex; justify-content: space-between; margin-top: 20px;
  }
  .btn {
    padding: 12px 24px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--accent);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
    font-size: 0.85rem; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(12px);
  }
  .btn:hover { background: rgba(201,184,150,0.1); box-shadow: 0 0 20px var(--accent-glow); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .btn-primary:hover { background: #d4c4a4; }
  .quiz-result {
    text-align: center; padding: 30px 20px;
  }
  .quiz-result-score {
    font-family: 'Georgia', 'Times New Roman', 'Noto Serif', serif;
    font-size: 3rem; color: var(--accent);
  }
  .quiz-result-text { font-size: 1rem; margin-top: 10px; }
  .tabs {
    display: flex; gap: 8px; margin-bottom: 20px;
    overflow-x: auto; padding-bottom: 4px;
  }
  .tab {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-dim);
    font-size: 0.8rem; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    backdrop-filter: blur(12px);
  }
  .tab.active { border-color: var(--accent); color: var(--accent); background: rgba(201,184,150,0.1); }
  .search-overlay {
    position: fixed; inset: 0; background: rgba(10,9,8,0.97);
    z-index: 300; display: none; flex-direction: column;
    padding: 20px;
  }
  .search-overlay.open { display: flex; }
  .search-input {
    width: 100%; padding: 16px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-size: 1rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-results { margin-top: 20px; overflow-y: auto; flex: 1; }
  .search-result-item {
    padding: 14px; border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .search-result-item:hover { background: rgba(201,184,150,0.05); }
  .search-result-title { font-weight: 600; color: var(--accent); font-size: 0.9rem; }
  .search-result-snippet { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }
  .table-wrap { overflow-x: auto; margin: 14px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--accent); font-weight: 600; background: rgba(201,184,150,0.05); }
  td { color: var(--text); }
  .footer-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10,9,8,0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 100;
  }
  .footer-btn { font-size: 0.8rem; color: var(--text-dim); background: none; border: none; cursor: pointer; }
  .footer-btn.active { color: var(--accent); }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.4s ease; }
  .tag {
    display: inline-block; padding: 4px 10px;
    border-radius: 6px; font-size: 0.7rem; font-weight: 600;
    margin-right: 6px; margin-bottom: 6px;
  }
  .tag-theory { background: rgba(201,184,150,0.1); color: var(--accent); border: 1px solid var(--accent-dim); }
  .tag-practice { background: rgba(127,176,105,0.1); color: var(--success); border: 1px solid rgba(127,176,105,0.2); }
  .tag-test { background: rgba(233,196,106,0.1); color: var(--warning); border: 1px solid rgba(233,196,106,0.2); }
  .case-box {
    background: rgba(201,184,150,0.04);
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 18px;
    margin: 14px 0;
  }
  .case-title {
    font-family: 'Georgia', 'Times New Roman', 'Noto Serif', serif;
    font-size: 1rem; color: var(--accent);
    margin-bottom: 10px;
  }
  .volume-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 6px;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: var(--accent);
    color: var(--bg);
    margin-left: 8px;
    vertical-align: middle;
  }
  .volume-badge.planned {
    background: transparent;
    color: var(--text-dim);
    border: 1px dashed var(--border);
  }
  .volumes-block {
    margin: 14px 20px 0;
    padding: 14px;
    background: rgba(201,184,150,0.04);
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  .volumes-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .volume-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    font-size: 0.78rem;
    color: var(--text-dim);
    border-bottom: 1px solid rgba(201,184,150,0.06);
  }
  .volume-row:last-child { border-bottom: none; }
  .volume-row.current { color: var(--text); }
  .volume-row .vol-num {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-weight: 700; color: var(--accent);
    flex-shrink: 0;
  }
  .volume-row.current .vol-num { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  details.reading {
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 12px;
    background: var(--bg-card);
    backdrop-filter: blur(12px);
  }
  details.reading summary {
    cursor: pointer;
    padding: 16px 20px;
    font-family: 'Georgia', 'Times New Roman', 'Noto Serif', serif;
    font-size: 1rem;
    color: var(--accent);
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  details.reading summary::-webkit-details-marker { display: none; }
  details.reading summary::after {
    content: '+';
    color: var(--text-dim);
    font-size: 1.2rem;
    flex-shrink: 0;
  }
  details.reading[open] summary::after { content: '−'; }
  details.reading[open] summary { border-bottom: 1px solid var(--border); }
  .reading-body { padding: 14px 20px 18px; }
  .reading-body h3 {
    font-family: 'Georgia', 'Times New Roman', 'Noto Serif', serif;
    font-size: 1rem;
    color: var(--accent);
    margin: 16px 0 8px;
  }
  .reading-body h3:first-child { margin-top: 4px; }
  .reading-body p { font-size: 0.88rem; margin-bottom: 10px; }
  .reading-body ul { margin-left: 18px; margin-bottom: 12px; }
  .reading-body li { font-size: 0.86rem; margin-bottom: 6px; }
  .reading-meta { font-size: 0.72rem; color: var(--text-dim); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  @media (min-width: 768px) {
    .main { padding: 90px 40px 100px; }
    .module-title { font-size: 2rem; }
    .card { padding: 28px; }
  }

</style>

<body>
<div class="app">
  <header class="header">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div>
      <div class="header-title">SousChefBook<span class="volume-badge">Тома 1–2</span></div>
      <div class="header-sub">Школа су-шефа и шефа · v2.0</div>
    </div>
    <button class="search-btn" onclick="toggleSearch()">🔍</button>
  </header>
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Школа су-шефа</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0% пройдено</div>
    </div>
    <div class="volumes-block">
      <div class="volumes-title">📚 Библиотека</div>
      <div class="volume-row current">
        <div class="vol-num">1</div>
        <div>Су-шеф → Шеф<br><span style="font-size:0.68rem;">15 модулей · в файле</span></div>
      </div>
      <div class="volume-row current">
        <div class="vol-num">2</div>
        <div>Шеф ресторана<br><span style="font-size:0.68rem;">6 модулей · в файле</span></div>
      </div>
      <div class="volume-row">
        <div class="vol-num">3</div>
        <div>Бренд-шеф и кухни сети<br><span style="font-size:0.68rem;">В планах</span></div>
      </div>
    </div>
    <div id="navList"></div>
  </nav>
  <div class="search-overlay" id="searchOverlay">
    <div style="display:flex;gap:12px;align-items:center;">
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск по базе знаний..." oninput="doSearch()">
      <button class="btn" onclick="toggleSearch()">✕</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
  <main class="main" id="main"></main>
  <div class="footer-nav">
    <button class="footer-btn" id="btnPrev" onclick="prevModule()">← Предыдущий</button>
    <span style="font-size:0.75rem;color:var(--text-dim);" id="footerCounter">1 / 15</span>
    <button class="footer-btn" id="btnNext" onclick="nextModule()">Следующий →</button>
  </div>
</div>
<script>
const modules = [
  {
    id: 1,
    title: "Роль шефа: от лучшего повара до управленца",
    time: "45 мин",
    theory: `<div class="card fade-in">
        <div class="card-title"><span class="card-icon">🎯</span> Главный сдвиг: шеф готовит не блюда, а систему</div>
        <p>Су-шеф — лучший повар на линии. Шеф — человек, при котором <strong>любой</strong> повар готовит как лучший. Это два разных мастерства, и переход между ними — самый сложный карьерный шаг на кухне.</p>
        <div class="table-wrap">
          <table>
            <tr><th></th><th>Су-шеф</th><th>Шеф</th></tr>
            <tr><td>Фокус</td><td>Смена, линия, скорость</td><td>Недели, меню, экономика, люди</td></tr>
            <tr><td>Успех</td><td>Прошёл пик без провалов</td><td>Кухня работает без его рук</td></tr>
            <tr><td>Инструменты</td><td>Нож, вок-горелка, гриль</td><td>Техкарты, график, фудкост, слово</td></tr>
            <tr><td>Команда</td><td>Контролирует</td><td>Выращивает</td></tr>
            <tr><td>Ошибка</td><td>«Сам быстрее сделаю»</td><td>«Всё держу в голове»</td></tr>
          </table>

// ===================== STATE =====================
let currentModule = 0;
let currentTab = 'theory';
let quizState = {};
let checklistState = {};

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('sousChefBookState') || '{}');
    currentModule = s.currentModule || 0;
    quizState = s.quizState || {};
    checklistState = s.checklistState || {};
  } catch(e) {}
}

function saveState() {
  localStorage.setItem('sousChefBookState', JSON.stringify({
    currentModule, quizState, checklistState
  }));
}

// ===================== NAVIGATION =====================
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.querySelector('.sidebar-overlay').classList.toggle('open');
}

function toggleSearch() {
  document.getElementById('searchOverlay').classList.toggle('open');
  if (document.getElementById('searchOverlay').classList.contains('open')) {
    setTimeout(() => document.getElementById('searchInput').focus(), 100);
  }
}

function renderNav() {
  const nav = document.getElementById('navList');
  let lastVol = 0;
  nav.innerHTML = modules.map((m, i) => {
    const done = isModuleDone(m.id);
    const vol = m.id <= 15 ? 1 : m.id <= 21 ? 2 : 3;
    let header = '';
    if (vol !== lastVol) {
      header = `<div style="padding:14px 20px 6px;font-size:0.65rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);">Том ${vol}</div>`;
      lastVol = vol;
    }
    return header + `<div class="nav-item ${i === currentModule ? 'active' : ''}" onclick="goToModule(${i})">
      <div class="nav-num">${m.id}</div>
      <div class="nav-text">${m.title}</div>
      <div class="nav-check ${done ? 'done' : ''}">${done ? '✓' : ''}</div>
    </div>`;
  }).join('');

  // Progress
  const doneCount = modules.filter(m => isModuleDone(m.id)).length;
  const pct = Math.round((doneCount / modules.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '% пройдено (' + doneCount + '/' + modules.length + ')';
}

function isModuleDone(mid) {
  const m = modules.find(x => x.id === mid);
  if (!m) return false;
  const q = quizState[mid] || {};
  const quizDone = Object.keys(q).length >= m.quiz.length && Object.values(q).every(v => v !== undefined);
  const c = checklistState[mid] || [];
  const checkDone = c.filter(Boolean).length >= m.checklist.length;
  return quizDone && checkDone;
}

function goToModule(i) {
  currentModule = i;
  currentTab = 'theory';
  saveState();
  renderModule();
  renderNav();
  toggleSidebar();
  window.scrollTo(0, 0);
}

function prevModule() {
  if (currentModule > 0) goToModule(currentModule - 1);
}

function nextModule() {
  if (currentModule < modules.length - 1) goToModule(currentModule + 1);
}

// ===================== MODULE RENDERING =====================
function renderModule() {
  const m = modules[currentModule];
  const main = document.getElementById('main');
  document.getElementById('footerCounter').textContent = (currentModule + 1) + ' / ' + modules.length;
  document.getElementById('btnPrev').disabled = currentModule === 0;
  document.getElementById('btnNext').disabled = currentModule === modules.length - 1;

  let content = `
    <div class="module-header fade-in">
      <div class="module-num">Модуль ${m.id}</div>
      <div class="module-title">${m.title}</div>
      <div class="module-time">⏱ ${m.time} &nbsp;|&nbsp; 
        <span class="tag tag-theory">Теория</span>
        <span class="tag tag-practice">Практика</span>
        <span class="tag tag-test">Тест</span>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${currentTab === 'theory' ? 'active' : ''}" onclick="switchTab('theory')">📖 Теория</div>
      <div class="tab ${currentTab === 'checklist' ? 'active' : ''}" onclick="switchTab('checklist')">✅ Чек-лист</div>
      <div class="tab ${currentTab === 'quiz' ? 'active' : ''}" onclick="switchTab('quiz')">🧩 Тест</div>
      <div class="tab ${currentTab === 'materials' ? 'active' : ''}" onclick="switchTab('materials')">📚 Материалы</div>
      <div class="tab ${currentTab === 'readings' ? 'active' : ''}" onclick="switchTab('readings')">📖 Обучающий материал</div>
    </div>
  `;

  if (currentTab === 'theory') {
    content += m.theory;
  } else if (currentTab === 'checklist') {
    content += renderChecklist(m);
  } else if (currentTab === 'materials') {
    content += renderMaterials(m);
  } else if (currentTab === 'readings') {
    content += renderReadings();
  } else {
    content += renderQuiz(m);
  }

  main.innerHTML = content;
}

function switchTab(tab) {
  currentTab = tab;
  saveState();
  renderModule();
}

// ===================== CHECKLIST =====================
function renderChecklist(m) {
  const checks = checklistState[m.id] || [];
  let html = '<div class="card fade-in"><div class="card-title"><span class="card-icon">✅</span> Практический чек-лист</div>';
  html += '<p>Отметьте пункты, которые вы уже освоили или выполнили:</p>';
  m.checklist.forEach((item, i) => {
    const done = checks[i] || false;
    html += `<div class="checklist-item" onclick="toggleCheck(${m.id}, ${i})">
      <div class="check-box ${done ? 'checked' : ''}">${done ? '✓' : ''}</div>
      <div class="check-text ${done ? 'done' : ''}">${item}</div>
    </div>`;
  });
  const doneCount = checks.filter(Boolean).length;
  html += `<div style="margin-top:14px;font-size:0.85rem;color:var(--text-dim);">Выполнено: ${doneCount} из ${m.checklist.length}</div>`;
  html += '</div>';
  return html;
}

function toggleCheck(mid, idx) {
  if (!checklistState[mid]) checklistState[mid] = [];
  checklistState[mid][idx] = !checklistState[mid][idx];
  saveState();
  renderModule();
  renderNav();
}

// ===================== QUIZ =====================
function renderQuiz(m) {
  const qState = quizState[m.id] || {};
  let html = '<div class="card fade-in"><div class="card-title"><span class="card-icon">🧩</span> Проверочный тест</div>';
  html += '<p>Ответьте на все вопросы, чтобы закрепить материал:</p></div>';

  let correctCount = 0;
  m.quiz.forEach((q, qi) => {
    const answered = qState[qi];
    const isCorrect = answered === q.correct;
    if (isCorrect) correctCount++;

    html += `<div class="card fade-in" style="margin-top:12px;">`;
    html += `<div class="quiz-question">${qi + 1}. ${q.q}</div>`;
    html += `<div class="quiz-options">`;
    q.options.forEach((opt, oi) => {
      let cls = '';
      if (answered !== undefined) {
        if (oi === q.correct) cls = 'correct';
        else if (oi === answered && oi !== q.correct) cls = 'wrong';
      } else if (answered === oi) {
        cls = 'selected';
      }
      html += `<div class="quiz-option ${cls}" onclick="answerQuiz(${m.id}, ${qi}, ${oi})">
        <div class="opt-letter">${String.fromCharCode(65 + oi)}</div>
        <div>${opt}</div>
      </div>`;
    });
    html += `</div>`;
    if (answered !== undefined) {
      html += `<div class="quiz-explanation show">${q.explanation}</div>`;
    }
    html += `</div>`;
  });

  // Result summary
  if (Object.keys(qState).length >= m.quiz.length) {
    const pct = Math.round((correctCount / m.quiz.length) * 100);
    let msg = '';
    if (pct >= 80) msg = 'Отлично! Вы хорошо усвоили материал.';
    else if (pct >= 60) msg = 'Хорошо, но есть над чем поработать.';
    else msg = 'Рекомендуем перечитать теорию и пройти тест снова.';

    html += `<div class="card fade-in" style="margin-top:16px;">
      <div class="quiz-result">
        <div class="quiz-result-score">${pct}%</div>
        <div class="quiz-result-text">${correctCount} из ${m.quiz.length} правильных ответов</div>
        <div style="margin-top:8px;font-size:0.85rem;color:var(--text-dim);">${msg}</div>
        <button class="btn" style="margin-top:16px;" onclick="resetQuiz(${m.id})">🔄 Пройти снова</button>
      </div>
    </div>`;
  }

  return html;
}

function answerQuiz(mid, qi, oi) {
  if (!quizState[mid]) quizState[mid] = {};
  if (quizState[mid][qi] !== undefined) return; // already answered
  quizState[mid][qi] = oi;
  saveState();
  renderModule();
  renderNav();
}

function resetQuiz(mid) {
  quizState[mid] = {};
  saveState();
  renderModule();
  renderNav();
}

function renderReadings() {
  let html = '<div class="card fade-in"><div class="card-title"><span class="card-icon">📖</span> Обучающий материал: основы базы работы</div>';
  html += '<p style="font-family:\'Georgia\', serif; font-size:1rem; line-height:1.6; color:var(--text); margin-bottom:16px;"><strong style="color:var(--accent);">Учитесь прямо на кухне — даже без интернета.</strong></p>';
  html += '<p style="margin-bottom:14px;">Разверните любую главу и читайте 5–6 минут: соль и жир, прожарка мяса, пять соусов, фудкост на пальцах — всё то, что отделяет повара от шефа, простыми словами и на примерах из вашей работы.</p>';
  html += '<p style="color:var(--text-dim); font-size:0.85rem;">Глубже погрузиться — в книгах из вкладки «📚 Материалы».</p></div>';
  readings.forEach(r => {
    html += '<details class="reading fade-in"><summary><span>№' + r.id + '. ' + r.title + '</span><span class="reading-meta">' + r.module + ' · ' + r.time + '</span></summary>';
    html += '<div class="reading-body">' + r.html + '</div></details>';
  });
  return html;
}

// ===================== SEARCH =====================
function doSearch() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const results = document.getElementById('searchResults');
  if (!query) { results.innerHTML = ''; return; }

  let hits = [];
  modules.forEach((m, mi) => {
    // Search in title
    if (m.title.toLowerCase().includes(query)) {
      hits.push({ module: mi, title: m.title, snippet: 'Модуль ' + m.id, type: 'title' });
    }
    // Search in theory (strip HTML)
    const text = m.theory.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').toLowerCase();
    if (text.includes(query)) {
      const idx = text.indexOf(query);
      const snippet = text.substring(Math.max(0, idx - 40), idx + query.length + 40);
      hits.push({ module: mi, title: m.title, snippet: '...' + snippet + '...', type: 'content' });
    }
    // Search in quiz
    m.quiz.forEach((q, qi) => {
      if (q.q.toLowerCase().includes(query) || q.explanation.toLowerCase().includes(query)) {
        hits.push({ module: mi, title: m.title + ' — Тест', snippet: q.q, type: 'quiz' });
      }
    });
  });

  results.innerHTML = hits.slice(0, 15).map(h => `
    <div class="search-result-item" onclick="goToModule(${h.module}); toggleSearch();">
      <div class="search-result-title">${h.title}</div>
      <div class="search-result-snippet">${h.snippet}</div>
    </div>
  `).join('');

  if (hits.length === 0) {
    results.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:40px;">Ничего не найдено</div>';
  }
}
